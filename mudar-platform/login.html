<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُدار — تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; display: flex; direction: rtl; height: 100vh; background: #FAFAF9; color: #1C1917; }
  .l-panel { width: 40%; background: #F4EDE6; display: flex; flex-direction: column; justify-content: space-between; padding: 48px; }
  .l-logo { font-size: 28px; font-weight: 900; color: #7B75A8; }
  .r-panel { flex: 1; display: flex; flex-direction: column; padding: 48px; background: #FFFFFF; }
  .r-form { max-width: 400px; margin: auto; width: 100%; }
  .r-title { font-size: 48px; font-weight: 900; margin-bottom: 40px; letter-spacing: -1px; }
  .r-field { margin-bottom: 24px; }
  .r-field label { display: block; font-size: 13px; font-weight: 700; color: #57534E; margin-bottom: 8px; }
  .r-input { width: 100%; background: #FAFAF9; border: 1px solid rgba(42,33,64,0.08); border-radius: 12px; padding: 16px; font-family: 'Cairo'; font-size: 16px; outline: none; transition: all .2s; }
  .r-input:focus { border-color: #7B75A8; background: #FFFFFF; box-shadow: 0 0 0 4px #EDE9F5; }
  .r-cta { background: #1C1917; color: #fff; border: none; border-radius: 50px; padding: 16px; width: 100%; font-family: 'Cairo'; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 24px; transition: all .3s; }
  .r-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(28,25,23,0.15); }
  .r-back { text-decoration: none; color: #A8A29E; font-weight: 600; font-size: 14px; }
  .r-error { background: #FEE2E2; color: #ef4444; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 20px; display: none; }
  @media(max-width: 768px) { body { flex-direction: column; } .l-panel { width: 100%; height: auto; padding: 24px; } .r-panel { padding: 24px; } }
</style>
</head>
<body>

<!-- ════ LEFT: Brand & Decoration ════ -->
<div class="l-panel">
  <!-- Large X lines across panel -->
  <svg class="l-lines" style="display:none" viewBox="0 0 100 100" preserveAspectRatio="none">
    <line x1="0" y1="0" x2="100" y2="100"
          stroke="rgba(255,255,255,0.065)" stroke-width=".4"
          vector-effect="non-scaling-stroke"/>
    <line x1="100" y1="0" x2="0" y2="100"
          stroke="rgba(255,255,255,0.065)" stroke-width=".4"
          vector-effect="non-scaling-stroke"/>
  </svg>

  <!-- Radial glow -->
  <div class="l-glow" style="display:none"></div>

  <!-- 8-ray asterisk -->
  <div class="l-star-wrap" style="display:none">
    <svg class="l-star" viewBox="0 0 120 120" fill="none">
      <!-- Vertical -->
      <line x1="60" y1="2"  x2="60" y2="118" stroke="white" stroke-width="2.2"/>
      <!-- Horizontal -->
      <line x1="2"  y1="60" x2="118" y2="60" stroke="white" stroke-width="2.2"/>
      <!-- Diagonal \ -->
      <line x1="16.4" y1="16.4" x2="103.6" y2="103.6" stroke="white" stroke-width="2.2"/>
      <!-- Diagonal / -->
      <line x1="103.6" y1="16.4" x2="16.4" y2="103.6" stroke="white" stroke-width="2.2"/>
    </svg>
  </div>

  <div class="l-logo">مُدار</div>

  <div class="l-footer">
    © ٢٠٢٦ مُدار<br>تسويق يُدار بالبيانات
  </div>
</div>

<!-- ════ RIGHT: Form ════ -->
<div class="r-panel">
  <div class="r-top">
    <a href="index.html" class="r-back">← الرئيسية</a>
  </div>

  <div class="r-form">
    <div class="r-eyebrow">أدخل بياناتك للمتابعة</div>
    <h1 class="r-title">تسجيل<br>الدخول</h1>

    <div class="r-error" id="errorMsg"></div>

    <div class="r-field">
      <label>الاسم الكامل</label>
      <input class="r-input" type="text" id="loginName"
             placeholder="اكتب اسمك" autocomplete="name">
    </div>

    <div class="r-field">
      <label>البريد الإلكتروني</label>
      <input class="r-input" type="email" id="loginEmail"
             placeholder="example@email.com"
             autocomplete="email"
             style="direction:ltr;text-align:right">
    </div>

    <div class="r-trust">
      <div class="r-trust-item"><span class="r-trust-dot"></span>مجاني للبدء</div>
      <div class="r-trust-item"><span class="r-trust-dot"></span>لا بطاقة</div>
      <div class="r-trust-item"><span class="r-trust-dot"></span>بيانات محمية</div>
    </div>
  </div>

  <!-- Circular submit button -->
  <button class="r-cta" onclick="doLogin()" id="loginBtn">
    <span class="r-cta-arrow">←</span>
    ابدأ
  </button>
</div>

<script>
function doLogin() {
  const name  = document.getElementById('loginName').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const err   = document.getElementById('errorMsg');

  if (!name || !email) {
    err.textContent = 'يرجى إدخال الاسم والبريد الإلكتروني';
    err.style.display = 'block'; return;
  }
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRe.test(email)) {
    err.textContent = 'البريد الإلكتروني غير صحيح';
    err.style.display = 'block'; return;
  }

  err.style.display = 'none';
  const bizTypeParam = new URLSearchParams(window.location.search).get('type') || '';
  sessionStorage.setItem('mudarUser', JSON.stringify({ name, email }));
  if (bizTypeParam) sessionStorage.setItem('mudarBizTypeHint', bizTypeParam);

  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<span style="font-size:22px;line-height:1">⋯</span>';
  btn.disabled = true;
  setTimeout(() => { window.location.href = 'pricing.html'; }, 400);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

const existing = sessionStorage.getItem('mudarUser');
if (existing) {
  try {
    const u = JSON.parse(existing);
    if (u.name)  document.getElementById('loginName').value  = u.name;
    if (u.email) document.getElementById('loginEmail').value = u.email;
  } catch(e) {}
}
</script>
</body>
</html>
